name: App distribution
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.4"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: uv sync --frozen --dev --group distribution --python 3.12.14 --managed-python
      - name: Record native runtime and TLS build inputs
        run: uv run --frozen python -c "import platform, ssl, sys; print(platform.platform(), platform.machine(), sys.version, ssl.OPENSSL_VERSION)"
      - run: uv run --frozen python -m unittest discover -s tests -p test_app_distribution.py
      - run: uv run --frozen python tools/build_standalone.py
      - run: uv run --frozen python tools/build_app_bootstrap.py
      - name: Qualify installed native runtime and fault recovery
        run: uv run --frozen python tools/smoke_app_distribution.py --evidence dist/standalone/qualification-${{ matrix.os }}.json
      - run: uv run --frozen python tools/smoke_app_managers.py
      - name: Qualify actual Homebrew installation when available
        if: runner.os == 'macOS'
        run: uv run --frozen python tools/smoke_app_homebrew.py --evidence dist/standalone/qualification-homebrew-${{ matrix.os }}.json
      - name: Retain immutable platform assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standalone-${{ matrix.os }}
          path: |
            dist/standalone/mos-*.tar.gz
            dist/standalone/mos-install-*
            dist/standalone/qualification-*.json
          if-no-files-found: error
