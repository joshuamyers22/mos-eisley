name: Published predecessor upgrade
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/published-upgrade.yml
      - tools/qualify_published_upgrade.py
      - tests/test_app_distribution.py
      - docs/qualification/rc2-upgrade-candidate.json
  push:
    branches: [main]
    paths:
      - .github/workflows/published-upgrade.yml
      - tools/qualify_published_upgrade.py
      - tests/test_app_distribution.py
      - docs/qualification/rc2-upgrade-candidate.json
permissions:
  actions: read
  contents: read
env:
  CANDIDATE_SOURCE: c090592ccc08b8bee118e9ae40e93875b17c1e0f
  ARTIFACT_SOURCE: 8ef4e6210dae6f455ac3dd7bc82097fd210aeb9e
  CANDIDATE_RUN: '38664890848'
jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retain reviewed signed metadata before selecting the legacy harness
        run: cp docs/qualification/rc2-upgrade-candidate.json "$RUNNER_TEMP/mos-rc2-upgrade-candidate.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # This retained rc.1/rc.2 experiment must use its epoch-1 harness,
          # not the current application's incompatible storage-epoch policy.
          ref: ${{ env.CANDIDATE_SOURCE }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
      - run: uv sync --frozen --dev
      - name: Require the exact passing native candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq 'select(.conclusion == "success") | .headSha' > candidate-source.txt
          test "$(cat candidate-source.txt)" = "$CANDIDATE_SOURCE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN }}
          name: standalone-${{ matrix.os }}
          path: .work/candidate
      - name: Acquire the immutable published predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.1" --jq 'select(.id == 413060239 and .immutable == true and .draft == false and .target_commitish == "8cf38c83591e505a9c7b57f4d701b12cb80fc4c6") | .id' > predecessor-id.txt
          test "$(cat predecessor-id.txt)" = 413060239
          gh release download v0.1.0-rc.1 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.1-$PLATFORM.tar.gz" --pattern "mos-install-$PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/predecessor
          cp "$RUNNER_TEMP/mos-rc2-upgrade-candidate.json" .work/candidate/release.json
          chmod 700 ".work/predecessor/mos-install-$PLATFORM" ".work/candidate/mos-install-$PLATFORM"
      - name: Qualify real upgrade, cold resume, recovery, rollback and uninstall
        env:
          PLATFORM: ${{ matrix.platform }}
        run: uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/predecessor --candidate .work/candidate --candidate-commit "$ARTIFACT_SOURCE" --evidence "dist/qualification/published-upgrade-$PLATFORM.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-upgrade-${{ matrix.os }}
          path: dist/qualification/published-upgrade-*.json
          if-no-files-found: error
