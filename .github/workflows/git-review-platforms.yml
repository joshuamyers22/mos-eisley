name: Git review native platforms
on:
  workflow_dispatch:
  push:
    branches: [feat/review-platform-qualification]
  pull_request:
    paths:
      - .github/workflows/git-review-platforms.yml
      - tools/qualify_git_review_platform.py
      - tools/qualify_git_review_wsl.ps1
      - tools/test_git_review_platform_qualification.py
      - src/mos_eisley/git_review*.py
      - tests/test_git_review*.py
      - tests/test_scoped_live_review.py
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      MOS_REQUIRE_TMUX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.4'
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: uv sync --frozen --dev
      - run: uv run --frozen python -m unittest discover -s tools -p test_git_review_platform_qualification.py -v
      - run: uv run --frozen pyright tools/qualify_git_review_platform.py tools/test_git_review_platform_qualification.py
      - run: uv run --frozen python tools/qualify_git_review_platform.py qualify --target linux --commit "$GITHUB_SHA" --output dist/qualification/linux.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: git-review-native-linux
          path: dist/qualification/*.json
          if-no-files-found: error
  wsl2:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start actual Windows-hosted WSL2 and qualify the Linux installation
        shell: pwsh
        run: ./tools/qualify_git_review_wsl.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: git-review-windows-wsl2
          path: dist/qualification/*.json
          if-no-files-found: error
