name: Stage npm publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: application-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.5"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: uv sync --frozen --dev
      - name: Verify the exact mainline release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python tools/verify_release.py --tag "$RELEASE_TAG" --main-ref refs/remotes/origin/main
      - name: Verify and generate the exact npm packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: uv run --frozen python tools/prepare_npm_publication.py --download --artifacts .work/npm-assets --output .work/npm-managers --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Stage native packages before the launcher
        shell: bash
        run: |
          set -euo pipefail
          for target in linux-aarch64 linux-x86_64 macos-aarch64 macos-x86_64 main; do
            npm stage publish "./.work/npm-managers/npm/$target" --access public --ignore-scripts
          done
      - name: Record the approval boundary
        run: echo 'Packages are staged. The npm owner must inspect and approve native packages before the launcher using npm 2FA.' >> "$GITHUB_STEP_SUMMARY"
