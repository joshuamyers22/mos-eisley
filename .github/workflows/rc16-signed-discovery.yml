name: rc.16 signed qualification recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/rc16-signed-discovery.yml
      - tools/qualify_rc16_discovery.py
      - tools/test_rc16_discovery.py
      - tools/rc16_qualification_gate.py
      - tools/test_rc16_qualification_gate.py
permissions:
  actions: read
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.4'
      - run: uv sync --frozen --dev
      - run: uv run --frozen python -m unittest discover -s tools -p test_rc16_discovery.py -v
      - run: uv run --frozen python -m unittest discover -s tools -p test_rc16_qualification_gate.py -v
      - run: uv run --frozen pyright tools/qualify_rc16_discovery.py tools/test_rc16_discovery.py tools/rc16_qualification_gate.py tools/test_rc16_qualification_gate.py
  intel-recovery:
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.4"
      - run: uv sync --frozen --dev
      - name: Require frozen preparation, three successful platforms and Intel timeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .work
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42102119299" > .work/protected-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42102119299/jobs?per_page=100" > .work/protected-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/check-runs/127590446087/annotations" > .work/timeout-annotations.json
          uv run --frozen python tools/rc16_qualification_gate.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 42102119299
          name: application-publication
          path: dist
      - name: Restore native bootstrap executable permissions
        run: chmod 700 dist/standalone/mos-install-*
      - name: Qualify the exact signed installation candidate
        if: matrix.group == 0
        run: uv run --frozen python tools/smoke_app_distribution.py --published-metadata dist/standalone/release.json --evidence dist/standalone/qualification-signed-macos-15-intel.json
      - name: Qualify installed terminal, diff and recovery on both stores
        if: matrix.group == 0
        env:
          SOURCE_COMMIT: '14eb79d52950f340aba159815222e04e6ea864e3'
          RELEASE_TAG: 'v0.1.0-rc.16'
        run: uv run --frozen python tools/qualify_installed_candidate.py --artifacts dist/standalone --expected-source "$SOURCE_COMMIT" --expected-version "${RELEASE_TAG#v}" --evidence dist/standalone/qualification-installed-macos-15-intel.json
      - name: Qualify upgrade from the actual published predecessor
        if: matrix.group == 1
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: '14eb79d52950f340aba159815222e04e6ea864e3'
        run: |
          UPGRADE_PLATFORM=$(uv run --frozen python -c 'from mos_eisley.app_release import platform_id; print(platform_id())')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.1" --jq 'select(.id == 413060239 and .immutable == true and .draft == false and .target_commitish == "8cf38c83591e505a9c7b57f4d701b12cb80fc4c6") | .id' > predecessor-id.txt
          test "$(cat predecessor-id.txt)" = 413060239
          gh release download v0.1.0-rc.1 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.1-$UPGRADE_PLATFORM.tar.gz" --pattern "mos-install-$UPGRADE_PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/published-predecessor
          chmod 700 ".work/published-predecessor/mos-install-$UPGRADE_PLATFORM"
          uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/published-predecessor --candidate dist/standalone --candidate-commit "$SOURCE_COMMIT" --evidence "dist/standalone/qualification-upgrade-$UPGRADE_PLATFORM.json"
      - name: Qualify upgrade from published rc.2
