name: rc.16 bounded startup diagnosis and qualification
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        required: true
        options: [diagnostic, qualify]
      diagnostic_run:
        type: string
        default: ''
  pull_request:
    paths:
      - .github/workflows/rc16-signed-discovery.yml
      - tools/qualify_rc16_discovery.py
      - tools/test_rc16_discovery.py
      - tools/rc16_qualification_gate.py
      - tools/test_rc16_qualification_gate.py
      - tools/diagnose_staged_startup.py
      - tools/test_staged_startup_diagnostics.py
permissions:
  actions: read
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.4'
      - run: uv sync --frozen --dev
      - run: uv run --frozen python -m unittest discover -s tools -p test_rc16_discovery.py -v
      - run: uv run --frozen python -m unittest discover -s tools -p test_rc16_qualification_gate.py -v
      - run: uv run --frozen python -m unittest discover -s tools -p test_staged_startup_diagnostics.py -v
      - run: uv run --frozen pyright tools/qualify_rc16_discovery.py tools/test_rc16_discovery.py tools/rc16_qualification_gate.py tools/test_rc16_qualification_gate.py tools/diagnose_staged_startup.py tools/test_staged_startup_diagnostics.py
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'diagnostic'
    needs: offline
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.4"
      - run: uv sync --frozen --dev
      - name: Require frozen preparation, three successful platforms and Intel timeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .work
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42102119299" > .work/protected-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42102119299/jobs?per_page=100" > .work/protected-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/check-runs/127590446087/annotations" > .work/timeout-annotations.json
          uv run --frozen python tools/rc16_qualification_gate.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 42102119299
          name: application-publication
          path: dist
      - name: Restore native bootstrap executable permissions
        run: chmod 700 dist/standalone/mos-install-*
      - name: Verify untouched signed source and software checksums
        working-directory: dist
        run: |
          test "$(cat SOURCE_COMMIT)" = 14eb79d52950f340aba159815222e04e6ea864e3
          shasum -a 256 -c SHA256SUMS
      - name: Observe the exact failed staged-version fixture without raw output
        run: uv run --frozen python -m tools.diagnose_staged_startup --evidence dist/diagnostics/staged-startup.json > /dev/null 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: rc16-staged-startup-diagnostic
          path: dist/diagnostics/*.json
          if-no-files-found: error
  intel-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'qualify'
    needs: offline
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.4"
      - run: uv sync --frozen --dev
      - name: Require frozen preparation, three successful platforms and Intel timeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .work
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42102119299" > .work/protected-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42102119299/jobs?per_page=100" > .work/protected-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/check-runs/127590446087/annotations" > .work/timeout-annotations.json
          uv run --frozen python tools/rc16_qualification_gate.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 42102119299
          name: application-publication
          path: dist
      - name: Restore native bootstrap executable permissions
        run: chmod 700 dist/standalone/mos-install-*
      - name: Verify untouched signed source and software checksums
        working-directory: dist
        run: |
          test "$(cat SOURCE_COMMIT)" = 14eb79d52950f340aba159815222e04e6ea864e3
          shasum -a 256 -c SHA256SUMS
      - name: Require reviewed exact-source diagnostic run
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN: ${{ inputs.diagnostic_run }}
        run: |
          uv run --frozen python -c 'import os; assert os.environ["DIAGNOSTIC_RUN"].isdigit()'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DIAGNOSTIC_RUN" > .work/diagnostic-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42233939365" > .work/predecessor-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42233939365/jobs?per_page=100" > .work/predecessor-jobs.json
          uv run --frozen python - <<'PYGUARD'
          import json, os
          from pathlib import Path
          r = json.loads(Path('.work/diagnostic-run.json').read_text())
          assert (r['id'], r['head_sha'], r['workflow_id'], r['event'], r['run_attempt'], r['conclusion']) == (int(os.environ['DIAGNOSTIC_RUN']), os.environ['GITHUB_SHA'], 408617556, 'workflow_dispatch', 1, 'success')
          r = json.loads(Path('.work/predecessor-run.json').read_text())
          assert (r['id'], r['head_sha'], r['workflow_id'], r['run_attempt'], r['conclusion']) == (42233939365, 'efba0d4781f0e5e4dd3c3cfa9e2b9efe31aa9d3c', 408617556, 1, 'failure')
          jobs = json.loads(Path('.work/predecessor-jobs.json').read_text())['jobs']
          for group in (1, 2, 3):
              found = [j for j in jobs if j['name'] == f'intel-recovery ({group})']
              assert len(found) == 1 and found[0]['conclusion'] == 'success'
          PYGUARD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.diagnostic_run }}
          name: rc16-staged-startup-diagnostic
          path: .work/diagnostic
      - name: Require exact valid observations within the unchanged 30-second contract
        run: |
          uv run --frozen python - <<'PYGUARD'
          import json, os
          from pathlib import Path
          r = json.loads(Path('.work/diagnostic/staged-startup.json').read_text())
          assert r['status'] == 'diagnostic_target_completed_within_original_deadline'
          assert (r['source_commit'], r['harness_source'], r['platform'], r['version']) == ('14eb79d52950f340aba159815222e04e6ea864e3', os.environ['GITHUB_SHA'], 'macos-x86_64', '0.1.0-rc.16')
          assert r['metadata_sha256'] == '1882d3db109ebc3b6f0d5c84de8dec0eecde96a47da5f72ad444d133b30ea3bc'
          assert r['observation_count'] == len(r['records']) == 2
          assert r['qualification_pass'] is False and r['provider_calls'] == 0
          for row in r['records']:
              assert row['contract_passed'] and row['cleanup_completed'] and row['version_matches']
              assert not row['original_deadline_exceeded'] and not row['output_limit_exceeded']
              assert row['deadline_ms'] == 30000 and row['observation_limit_ms'] == 120000
          assert r['records'][1]['location'] == 'stage' and r['records'][1]['version_kind'] == 'candidate'
          PYGUARD
      - name: Qualify the exact signed installation candidate
        run: uv run --frozen python tools/smoke_app_distribution.py --published-metadata dist/standalone/release.json --evidence dist/standalone/qualification-signed-macos-15-intel.json
      - name: Qualify installed terminal, diff and recovery on both stores
        env:
          SOURCE_COMMIT: '14eb79d52950f340aba159815222e04e6ea864e3'
          RELEASE_TAG: 'v0.1.0-rc.16'
        run: uv run --frozen python tools/qualify_installed_candidate.py --artifacts dist/standalone --expected-source "$SOURCE_COMMIT" --expected-version "${RELEASE_TAG#v}" --evidence dist/standalone/qualification-installed-macos-15-intel.json
      - name: Qualify signed offline native progress receipts
        env:
          SOURCE_COMMIT: '14eb79d52950f340aba159815222e04e6ea864e3'
          RELEASE_TAG: 'v0.1.0-rc.16'
        run: uv run --frozen python tools/qualify_native_progress.py --artifacts dist/standalone --expected-source "$SOURCE_COMMIT" --expected-version "${RELEASE_TAG#v}" --evidence dist/standalone/qualification-progress-macos-15-intel.json
      - name: Qualify generated signed Homebrew preview formula
        run: uv run --frozen python tools/smoke_app_homebrew.py --published-metadata dist/standalone/release.json --evidence dist/standalone/qualification-homebrew-macos-15-intel.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: rc16-intel-qualification
          path: dist/standalone/qualification-*.json
          if-no-files-found: error
  discovery:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'qualify'
    needs: [offline, intel-qualification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CANDIDATE_RUN: '42102119299'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.4'
      - run: uv sync --frozen --dev
      - name: Require original frozen preparation and preserved Intel timeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .work
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > .work/protected-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/jobs?per_page=100" > .work/protected-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/check-runs/127590446087/annotations" > .work/timeout-annotations.json
          uv run --frozen python tools/rc16_qualification_gate.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN }}
          name: application-publication
          path: dist/signed
      - name: Acquire actual immutable rc.15 predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.platform }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.15" --jq 'select(.id == 435339429 and .immutable == true and .draft == false and .target_commitish == "21fc2b02db5611d806626ad8c70698b3c7181577") | .id' > .work/predecessor-id.txt
          test "$(cat .work/predecessor-id.txt)" = 435339429
          gh release download v0.1.0-rc.15 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.15-$TARGET.tar.gz" --pattern "mos-install-$TARGET" --pattern BOOTSTRAP_SHA256SUMS --dir .work/predecessor
      - name: Verify untouched signed package inventory
        working-directory: dist/signed
        run: |
          test "$(cat SOURCE_COMMIT)" = 14eb79d52950f340aba159815222e04e6ea864e3
          shasum -a 256 -c SHA256SUMS
      - name: Actual signed old-refusal, explicit upgrade and public discovery
        env:
          HARNESS_SOURCE: ${{ github.sha }}
          TARGET: ${{ matrix.platform }}
        run: |
          chmod 700 "dist/signed/standalone/mos-install-$TARGET" ".work/predecessor/mos-install-$TARGET"
          uv run --frozen python -m tools.qualify_rc16_discovery --candidate dist/signed/standalone --predecessor .work/predecessor --platform "$TARGET" --harness-source "$HARNESS_SOURCE" --evidence "dist/qualification/qualification-discovery-$TARGET.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: rc16-discovery-${{ matrix.platform }}
          path: dist/qualification/*.json
          if-no-files-found: error
