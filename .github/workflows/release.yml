name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  actions: read
  contents: read
jobs:
  standalone:
    uses: ./.github/workflows/app-distribution.yml
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  prepare:
    environment: application-release
    needs: [gitleaks, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4"
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project --python 3.12 python tools/verify_release.py --tag "$RELEASE_TAG" --main-ref refs/remotes/origin/main
      - run: uv sync --frozen --dev
      - run: make check audit
      - run: make container
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./dist
          artifact-name: release-sbom.cdx.json
          output-file: ./dist/release-sbom.cdx.json
          format: cyclonedx-json
          upload-artifact: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: standalone-*
          path: dist/standalone
          merge-multiple: true
      - name: Prepare signed application publication
        env:
          MOS_RELEASE_SIGNING_KEY_BASE64: ${{ secrets.MOS_RELEASE_SIGNING_KEY_BASE64 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: uv run --frozen python tools/prepare_app_publication.py --commit "$SOURCE_COMMIT"
      - name: Record release commit
        run: git rev-parse HEAD > dist/SOURCE_COMMIT
      - name: Checksum release artifacts
        working-directory: dist
        run: sha256sum *.whl *.tar.gz release-sbom.cdx.json SOURCE_COMMIT > SHA256SUMS
      - name: Retain the signed publication candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: application-publication
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-sbom.cdx.json
            dist/SOURCE_COMMIT
            dist/SHA256SUMS
            dist/standalone/mos-*.tar.gz
            dist/standalone/mos-install-*
            dist/standalone/release.json
            dist/standalone/install.sh
            dist/standalone/BOOTSTRAP_SHA256SUMS
            dist/managers/*.rb
  qualify-signed:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: "0.13.4"
      - run: uv sync --frozen --dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: application-publication
          path: dist
      - name: Restore native bootstrap executable permissions
        run: chmod 700 dist/standalone/mos-install-*
      - name: Qualify the exact signed installation candidate
        run: uv run --frozen python tools/smoke_app_distribution.py --published-metadata dist/standalone/release.json --evidence dist/standalone/qualification-signed-${{ matrix.os }}.json
      - name: Qualify installed terminal, diff and recovery on both stores
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python tools/qualify_installed_candidate.py --artifacts dist/standalone --expected-source "$SOURCE_COMMIT" --expected-version "${RELEASE_TAG#v}" --evidence dist/standalone/qualification-installed-${{ matrix.os }}.json
      - name: Qualify upgrade from the actual published predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          UPGRADE_PLATFORM=$(uv run --frozen python -c 'from mos_eisley.app_release import platform_id; print(platform_id())')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.1" --jq 'select(.id == 413060239 and .immutable == true and .draft == false and .target_commitish == "8cf38c83591e505a9c7b57f4d701b12cb80fc4c6") | .id' > predecessor-id.txt
          test "$(cat predecessor-id.txt)" = 413060239
          gh release download v0.1.0-rc.1 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.1-$UPGRADE_PLATFORM.tar.gz" --pattern "mos-install-$UPGRADE_PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/published-predecessor
          chmod 700 ".work/published-predecessor/mos-install-$UPGRADE_PLATFORM"
          uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/published-predecessor --candidate dist/standalone --candidate-commit "$SOURCE_COMMIT" --evidence "dist/standalone/qualification-upgrade-$UPGRADE_PLATFORM.json"
      - name: Qualify upgrade from published rc.2
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          UPGRADE_PLATFORM=$(uv run --frozen python -c 'from mos_eisley.app_release import platform_id; print(platform_id())')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.2" --jq 'select(.id == 413979297 and .immutable == true and .draft == false and .target_commitish == "ef6a66fc8911902cef7a91828b4b26e7d329020c") | .id' > predecessor-rc2-id.txt
          test "$(cat predecessor-rc2-id.txt)" = 413979297
          gh release download v0.1.0-rc.2 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.2-$UPGRADE_PLATFORM.tar.gz" --pattern "mos-install-$UPGRADE_PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/published-predecessor-rc2
          chmod 700 ".work/published-predecessor-rc2/mos-install-$UPGRADE_PLATFORM"
          uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/published-predecessor-rc2 --predecessor-version 0.1.0-rc.2 --candidate dist/standalone --candidate-commit "$SOURCE_COMMIT" --evidence "dist/standalone/qualification-upgrade-rc2-$UPGRADE_PLATFORM.json"
      - name: Qualify upgrade from published rc.3
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          UPGRADE_PLATFORM=$(uv run --frozen python -c 'from mos_eisley.app_release import platform_id; print(platform_id())')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.3" --jq 'select(.id == 414195118 and .immutable == true and .draft == false and .target_commitish == "b3f04b46fb2091e861bdf3fc5e900d933cf804b3") | .id' > predecessor-rc3-id.txt
          test "$(cat predecessor-rc3-id.txt)" = 414195118
          gh release download v0.1.0-rc.3 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.3-$UPGRADE_PLATFORM.tar.gz" --pattern "mos-install-$UPGRADE_PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/published-predecessor-rc3
          chmod 700 ".work/published-predecessor-rc3/mos-install-$UPGRADE_PLATFORM"
          uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/published-predecessor-rc3 --predecessor-version 0.1.0-rc.3 --candidate dist/standalone --candidate-commit "$SOURCE_COMMIT" --evidence "dist/standalone/qualification-upgrade-rc3-$UPGRADE_PLATFORM.json"
      - name: Qualify upgrade from published rc.5
        env:
          GH_TOKEN: ${{ github.token }}
