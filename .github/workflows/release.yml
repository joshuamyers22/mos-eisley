name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  actions: read
  contents: read
jobs:
  standalone:
    uses: ./.github/workflows/app-distribution.yml
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  prepare:
    environment: application-release
    needs: [gitleaks, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project --python 3.12 python tools/verify_release.py --tag "$RELEASE_TAG" --main-ref refs/remotes/origin/main
      - run: uv sync --frozen --dev
      - run: make check audit
      - run: make container
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./dist
          artifact-name: release-sbom.cdx.json
          output-file: ./dist/release-sbom.cdx.json
          format: cyclonedx-json
          upload-artifact: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: standalone-*
          path: dist/standalone
          merge-multiple: true
      - name: Prepare signed application publication
        env:
          MOS_RELEASE_SIGNING_KEY_BASE64: ${{ secrets.MOS_RELEASE_SIGNING_KEY_BASE64 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: uv run --frozen python tools/prepare_app_publication.py --commit "$SOURCE_COMMIT"
      - name: Record release commit
        run: git rev-parse HEAD > dist/SOURCE_COMMIT
      - name: Checksum release artifacts
        working-directory: dist
        run: sha256sum *.whl *.tar.gz release-sbom.cdx.json SOURCE_COMMIT > SHA256SUMS
      - name: Retain the signed publication candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-publication
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-sbom.cdx.json
            dist/SOURCE_COMMIT
            dist/SHA256SUMS
            dist/standalone/mos-*.tar.gz
            dist/standalone/mos-install-*
            dist/standalone/release.json
            dist/standalone/install.sh
            dist/standalone/BOOTSTRAP_SHA256SUMS
            dist/managers/*.rb
  qualify-signed:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.5"
      - run: uv sync --frozen --dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: application-publication
          path: dist
      - name: Restore native bootstrap executable permissions
        run: chmod 700 dist/standalone/mos-install-*
      - name: Qualify the exact signed installation candidate
        run: uv run --frozen python tools/smoke_app_distribution.py --published-metadata dist/standalone/release.json --evidence dist/standalone/qualification-signed-${{ matrix.os }}.json
      - name: Qualify generated signed Homebrew preview formula
        if: runner.os == 'macOS'
        run: uv run --frozen python tools/smoke_app_homebrew.py --published-metadata dist/standalone/release.json --evidence dist/standalone/qualification-homebrew-${{ matrix.os }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-qualification-${{ matrix.os }}
          path: dist/standalone/qualification-*.json
          if-no-files-found: error
  publish:
    needs: [prepare, qualify-signed]
    environment: application-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: application-publication
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: signed-qualification-*
          path: dist/qualification
      - name: Require a new release or a matching unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 tools/publish_app_release.py preflight --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Upload all qualified assets to a draft
        id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-sbom.cdx.json
            dist/SOURCE_COMMIT
            dist/SHA256SUMS
            dist/standalone/mos-*.tar.gz
            dist/standalone/mos-install-*
            dist/standalone/release.json
            dist/standalone/install.sh
            dist/standalone/BOOTSTRAP_SHA256SUMS
            dist/managers/*.rb
            dist/qualification/*/*.json
      - name: Verify the uploaded inventory and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          DRAFT_RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: python3 tools/publish_app_release.py finalize --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --release-id "$DRAFT_RELEASE_ID"
