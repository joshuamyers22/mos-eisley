        run: |
          UPGRADE_PLATFORM=$(uv run --frozen python -c 'from mos_eisley.app_release import platform_id; print(platform_id())')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.5" --jq 'select(.id == 420137559 and .immutable == true and .draft == false and .target_commitish == "b04906553f2622210adc82c43893777a6b98aa44") | .id' > predecessor-rc5-id.txt
          test "$(cat predecessor-rc5-id.txt)" = 420137559
          gh release download v0.1.0-rc.5 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.5-$UPGRADE_PLATFORM.tar.gz" --pattern "mos-install-$UPGRADE_PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/published-predecessor-rc5
          chmod 700 ".work/published-predecessor-rc5/mos-install-$UPGRADE_PLATFORM"
          uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/published-predecessor-rc5 --predecessor-version 0.1.0-rc.5 --candidate dist/standalone --candidate-commit "$SOURCE_COMMIT" --evidence "dist/standalone/qualification-upgrade-rc5-$UPGRADE_PLATFORM.json"
      - name: Qualify upgrade from published rc.7
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          UPGRADE_PLATFORM=$(uv run --frozen python -c 'from mos_eisley.app_release import platform_id; print(platform_id())')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.7" --jq 'select(.id == 421278021 and .immutable == true and .draft == false and .target_commitish == "78bc17ce561df7e641a4dd0fc5aef56aa9deee58") | .id' > predecessor-rc7-id.txt
          test "$(cat predecessor-rc7-id.txt)" = 421278021
          gh release download v0.1.0-rc.7 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.7-$UPGRADE_PLATFORM.tar.gz" --pattern "mos-install-$UPGRADE_PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/published-predecessor-rc7
          chmod 700 ".work/published-predecessor-rc7/mos-install-$UPGRADE_PLATFORM"
          uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/published-predecessor-rc7 --predecessor-version 0.1.0-rc.7 --candidate dist/standalone --candidate-commit "$SOURCE_COMMIT" --evidence "dist/standalone/qualification-upgrade-rc7-$UPGRADE_PLATFORM.json"
      - name: Qualify upgrade from published rc.9
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          UPGRADE_PLATFORM=$(uv run --frozen python -c 'from mos_eisley.app_release import platform_id; print(platform_id())')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.9" --jq 'select(.id == 424828190 and .immutable == true and .draft == false and .target_commitish == "f94842a44b9fc5dcf42a7f5880a6683e4fdc0b23") | .id' > predecessor-rc9-id.txt
          test "$(cat predecessor-rc9-id.txt)" = 424828190
          gh release download v0.1.0-rc.9 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.9-$UPGRADE_PLATFORM.tar.gz" --pattern "mos-install-$UPGRADE_PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/published-predecessor-rc9
          chmod 700 ".work/published-predecessor-rc9/mos-install-$UPGRADE_PLATFORM"
          uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/published-predecessor-rc9 --predecessor-version 0.1.0-rc.9 --candidate dist/standalone --candidate-commit "$SOURCE_COMMIT" --evidence "dist/standalone/qualification-upgrade-rc9-$UPGRADE_PLATFORM.json"
      - name: Qualify upgrade from published rc.10
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          UPGRADE_PLATFORM=$(uv run --frozen python -c 'from mos_eisley.app_release import platform_id; print(platform_id())')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.10" --jq 'select(.id == 428076837 and .immutable == true and .draft == false and .target_commitish == "9ffd540674cc322857c05f09bcaf8dc816b3ff64") | .id' > predecessor-rc10-id.txt
          test "$(cat predecessor-rc10-id.txt)" = 428076837
          gh release download v0.1.0-rc.10 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.10-$UPGRADE_PLATFORM.tar.gz" --pattern "mos-install-$UPGRADE_PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/published-predecessor-rc10
          chmod 700 ".work/published-predecessor-rc10/mos-install-$UPGRADE_PLATFORM"
          uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/published-predecessor-rc10 --predecessor-version 0.1.0-rc.10 --candidate dist/standalone --candidate-commit "$SOURCE_COMMIT" --evidence "dist/standalone/qualification-upgrade-rc10-$UPGRADE_PLATFORM.json"
      - name: Qualify upgrade from published rc.11
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          UPGRADE_PLATFORM=$(uv run --frozen python -c 'from mos_eisley.app_release import platform_id; print(platform_id())')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.11" --jq 'select(.id == 429106203 and .immutable == true and .draft == false and .target_commitish == "4d927cea23ff18f6aa9d231f7c342ee8e2420c84") | .id' > predecessor-rc11-id.txt
          test "$(cat predecessor-rc11-id.txt)" = 429106203
          gh release download v0.1.0-rc.11 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.11-$UPGRADE_PLATFORM.tar.gz" --pattern "mos-install-$UPGRADE_PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/published-predecessor-rc11
          chmod 700 ".work/published-predecessor-rc11/mos-install-$UPGRADE_PLATFORM"
          uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/published-predecessor-rc11 --predecessor-version 0.1.0-rc.11 --candidate dist/standalone --candidate-commit "$SOURCE_COMMIT" --evidence "dist/standalone/qualification-upgrade-rc11-$UPGRADE_PLATFORM.json"
      - name: Qualify upgrade from published rc.12
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          UPGRADE_PLATFORM=$(uv run --frozen python -c 'from mos_eisley.app_release import platform_id; print(platform_id())')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0-rc.12" --jq 'select(.id == 430032833 and .immutable == true and .draft == false and .target_commitish == "2f75d429c87b3b48c946832ff9c73748abf94efe") | .id' > predecessor-rc12-id.txt
          test "$(cat predecessor-rc12-id.txt)" = 430032833
          gh release download v0.1.0-rc.12 --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern "mos-0.1.0-rc.12-$UPGRADE_PLATFORM.tar.gz" --pattern "mos-install-$UPGRADE_PLATFORM" --pattern BOOTSTRAP_SHA256SUMS --dir .work/published-predecessor-rc12
          chmod 700 ".work/published-predecessor-rc12/mos-install-$UPGRADE_PLATFORM"
          uv run --frozen python tools/qualify_published_upgrade.py --predecessor .work/published-predecessor-rc12 --predecessor-version 0.1.0-rc.12 --candidate dist/standalone --candidate-commit "$SOURCE_COMMIT" --evidence "dist/standalone/qualification-upgrade-rc12-$UPGRADE_PLATFORM.json"
      - name: Qualify signed offline native progress receipts
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python tools/qualify_native_progress.py --artifacts dist/standalone --expected-source "$SOURCE_COMMIT" --expected-version "${RELEASE_TAG#v}" --evidence dist/standalone/qualification-progress-${{ matrix.os }}.json
      - name: Qualify generated signed Homebrew preview formula
        if: runner.os == 'macOS'
        run: uv run --frozen python tools/smoke_app_homebrew.py --published-metadata dist/standalone/release.json --evidence dist/standalone/qualification-homebrew-${{ matrix.os }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: signed-qualification-${{ matrix.os }}
          path: dist/standalone/qualification-*.json
          if-no-files-found: error
  publish:
    needs: [prepare, qualify-signed]
    environment: application-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: application-publication
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: signed-qualification-*
          path: dist/qualification
      - name: Require a new release or a matching unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 tools/publish_app_release.py preflight --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Upload all qualified assets to a draft
        id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-sbom.cdx.json
            dist/SOURCE_COMMIT
            dist/SHA256SUMS
            dist/standalone/mos-*.tar.gz
            dist/standalone/mos-install-*
            dist/standalone/release.json
            dist/standalone/install.sh
            dist/standalone/BOOTSTRAP_SHA256SUMS
            dist/managers/*.rb
            dist/qualification/*/*.json
      - name: Verify the uploaded inventory and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          DRAFT_RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: python3 tools/publish_app_release.py finalize --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --release-id "$DRAFT_RELEASE_ID"
